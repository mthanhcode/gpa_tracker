<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)" rx="12"/>

  <!-- Border gradient -->
  <rect width="798" height="198" x="1" y="1" fill="none" stroke="url(#border)" stroke-width="1.5" rx="11"/>
  <defs>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#f78166;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Stars -->
  <circle cx="50" cy="30" r="1.2" fill="white" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="15" r="0.8" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.05;0.6" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="40" r="1.5" fill="#58a6ff" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="20" r="1" fill="white" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="10" r="1.2" fill="#f78166" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="35" r="0.9" fill="white" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="18" r="1.3" fill="#58a6ff" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="28" r="1" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="50" r="0.8" fill="#f78166" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="30" cy="160" r="1" fill="white" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="175" r="1.2" fill="#58a6ff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.05;0.6" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="170" r="1" fill="white" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="155" r="1.4" fill="#f78166" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="470" cy="185" r="0.9" fill="white" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Sparkle 1 -->
  <g transform="translate(70, 80)">
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#f0e68c" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;45;0" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#f0e68c" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;45;0" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Sparkle 2 -->
  <g transform="translate(720, 110)">
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Sparkle 3 -->
  <g transform="translate(400, 170)">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#f78166" stroke-width="1.2" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite"/>
    </line>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#f78166" stroke-width="1.2" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Emoji cap -->
  <text x="400" y="75" font-size="32" text-anchor="middle">🎓</text>

  <!-- Main title glow effect -->
  <text x="400" y="118" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="bold"
        text-anchor="middle" fill="#58a6ff" filter="url(#glow2)" opacity="0.5">
    GPA Tracker
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="118" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="bold"
        text-anchor="middle" fill="white" filter="url(#glow)">
    GPA Tracker
    <animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="400" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="14"
        text-anchor="middle" fill="#8b949e" letter-spacing="2">
    TRƯỜNG CAO ĐẲNG CÔNG THƯƠNG TP.HCM
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Decorative line -->
  <line x1="150" y1="160" x2="650" y2="160" stroke="#58a6ff" stroke-width="0.5" opacity="0.3"/>
</svg>
